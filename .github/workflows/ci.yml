name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # With the four RP_* secrets configured the APK is release-signed;
      # without them the build falls back to debug signing (see
      # android/app/build.gradle.kts) so forks and secret-less runs stay
      # green. RP_KEYSTORE_BASE64 is `base64 < keystore.jks`.
      - name: Prepare release signing
        if: ${{ secrets.RP_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "RP_KEYSTORE_PASSWORD=${{ secrets.RP_KEYSTORE_PASSWORD }}"
            echo "RP_KEY_ALIAS=${{ secrets.RP_KEY_ALIAS }}"
            echo "RP_KEY_PASSWORD=${{ secrets.RP_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
